name: Build StockLens Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Android Environment
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls -la "$ANDROID_HOME"

      - name: Install Node Dependencies
        run: npm install

      - name: Prepare Web Assets Bundle
        run: npm run prepare:www

      - name: Add Capacitor Android Platform
        run: npx cap add android

      - name: Sync Capacitor Project
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Organize APK Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/StockLens-v1.0.apk
          echo "APK generated successfully:"
          ls -lh build-output/StockLens-v1.0.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockLens-APK
          path: build-output/StockLens-v1.0.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: StockLens Operations Intelligence v1.0.0 (APK Release)
          body: |
            ## StockLens Mobile & Terminal APK (v1.0.0)

            Installable Android application for StockLens Operations Intelligence.

            ### ✨ What's Included:
            - **Advanced User Login & RBAC**: Admin (`bahalul1964@gmail.com`), Floor Operator, and Audit Inspector accounts.
            - **4-Digit Terminal PIN Pad**: Fast keypad login for warehouse and sales kiosks.
            - **Master Dataset Embedded**: Complete 24,207 operational records, 15,862 IMEIs tracked.
            - **IMEI Intelligence & Timeline**: Event classification, warranty signals, and refund eligibility.
            - **Offline-First Resilience**: Runs 100% offline with zero server dependency.
            - **Multilingual**: English, Bengali (বাংলা), and Chinese (中文).

            ### 📲 Direct Download:
            Download **[StockLens-v1.0.apk](https://github.com/abraar05/StockLens/releases/download/v1.0.0/StockLens-v1.0.apk)** and install on any Android phone or tablet.
          files: build-output/StockLens-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
