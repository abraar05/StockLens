<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>StockLens · Operations Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">S</div><div><strong>StockLens</strong><span>Operations intelligence</span></div></div>
      <nav id="nav" class="nav"></nav>
      <div class="side-note"><span class="pulse"></span><span id="dataState">Local data ready</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn mobile-only">☰</button>
        <div><div class="eyebrow" id="pageKicker">COMMAND CENTER</div><h1 id="pageTitle">Operations overview</h1></div>
        <div class="top-actions"><button class="ghost-btn" id="importTop">↥ <span data-i18n="import">Import</span></button><button class="primary-btn" id="exportTop">↧ <span data-i18n="export">Export</span></button><div class="select-wrap"><select id="langSelect" aria-label="Language"><option value="en">English</option><option value="bn">বাংলা</option><option value="zh">中文</option></select></div></div>
      </header>
      <section id="view"></section>
    </main>
  </div>
  <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.json" hidden />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
